name: sistem-marketplace-broker

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: ${DOCKER_UID:-1000}
        GID: ${DOCKER_GID:-1000}
    container_name: sistem-marketplace-broker-app
    working_dir: /var/www/html
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: sistem_marketplace_broker
      DB_USERNAME: laravel
      DB_PASSWORD: laravel
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - marketplace-network

  vite:
    image: node:22-bookworm-slim
    container_name: sistem-marketplace-broker-vite
    working_dir: /var/www/html
    restart: unless-stopped
    user: "1000:1000"
    volumes:
      - ./:/var/www/html
    ports:
      - "5173:5173"
    command: npm run dev
    depends_on:
      - app
    networks:
      - marketplace-network

  mysql:
    image: mysql:8.4
    container_name: sistem-marketplace-broker-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sistem_marketplace_broker
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - marketplace-network

networks:
  marketplace-network:
    driver: bridge

volumes:
  mysql_data:
